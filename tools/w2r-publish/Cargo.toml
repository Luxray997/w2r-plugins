[package]
name = "w2r-publish"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Release tooling for w2r-plugins: check manifests, build packages, assemble and verify the plugin index"

[dependencies]
w2r-formats.workspace = true
w2r-loader-lib.workspace = true
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

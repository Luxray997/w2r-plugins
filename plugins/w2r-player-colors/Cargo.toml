[package]
name = "w2r-player-colors"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Shows a row of player color boxes in the top bar, to the right of your food count"

[lib]
name = "w2r_player_colors"
crate-type = ["cdylib", "rlib"]

[dependencies]
w2r-abi.workspace = true

[lints.clippy]
# Detours are called by the game; the ABI header documents the contract.
missing_safety_doc = "allow"

[package]
name = "w2r-remember-settings"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Remembers the settings of your last created game and restores them on the next Create Multiplayer Game screen"

[lib]
name = "w2r_remember_settings"
crate-type = ["cdylib", "rlib"]

[dependencies]
w2r-abi.workspace = true

[lints.clippy]
# Detours are called by the game; the ABI header documents the contract.
missing_safety_doc = "allow"

[package]
name = "w2r-observer"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Lets a player observe a game: pick OBS as the team in the lobby and see the whole map"

[lib]
name = "w2r_observer"
crate-type = ["cdylib", "rlib"]

[dependencies]
w2r-abi.workspace = true

[lints.clippy]
# Detours are called by the game; the ABI header documents the contract.
missing_safety_doc = "allow"

[package]
name = "w2r-random-map"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "A Random map button on the Create Multiplayer Game screen, with an optional player-count filter"

[lib]
name = "w2r_random_map"
crate-type = ["cdylib", "rlib"]

[dependencies]
w2r-abi.workspace = true

[lints.clippy]
# Callbacks are called by the host; the ABI header documents the contract.
missing_safety_doc = "allow"

[package]
name = "w2r-map-preview"
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Shows the lobby's map preview inside a running match, toggled by a hotkey"

[lib]
name = "w2r_map_preview"
crate-type = ["cdylib", "rlib"]

[dependencies]
w2r-abi.workspace = true
w2r-preview.workspace = true

[lints.clippy]
# Detours are called by the game; the ABI header documents the contract.
missing_safety_doc = "allow"

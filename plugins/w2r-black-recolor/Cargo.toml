[package]
name = "w2r-black-recolor"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Recolors the black player pink or cyan on your screen, for visibility"

[lib]
name = "w2r_black_recolor"
crate-type = ["cdylib", "rlib"]

[dependencies]
w2r-abi.workspace = true

[lints.clippy]
# Detours are called by the game; the ABI header documents the contract.
missing_safety_doc = "allow"

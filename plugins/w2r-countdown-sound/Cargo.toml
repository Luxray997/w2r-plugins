[package]
name = "w2r-countdown-sound"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
publish = false
description = "Plays a beep for each second of the lobby start countdown and a higher one when the game starts"

[lib]
name = "w2r_countdown_sound"
crate-type = ["cdylib", "rlib"]

[dependencies]
w2r-abi.workspace = true

[lints.clippy]
# Entry points are called by the host; the ABI header documents the contract.
missing_safety_doc = "allow"

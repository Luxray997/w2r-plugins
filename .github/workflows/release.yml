name: release
# Builds packages for new plugin versions, assembles the index and publishes it to the gh-pages
# branch (GitHub Pages serves it). The index is not signed (docs/PIPELINE.md).
on:
  push:
    branches: [main]
    paths: ["plugins/**", "tools/**", "Cargo.*", ".github/workflows/release.yml"]
  workflow_dispatch: {} # re-run without changes

permissions:
  contents: write # package releases and the gh-pages branch

concurrency:
  group: release
  cancel-in-progress: false

env:
  # Fetch git dependencies (w2r-mod-loader) with the git CLI, so cargo uses git's credential setup.
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  DOWNLOAD_BASE: https://github.com/hastinbe/w2r-plugins/releases/download

jobs:
  assemble:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Let git read the private w2r-mod-loader repository
        # A fine-grained token with read access to hastinbe/w2r-mod-loader only (docs/PIPELINE.md). Remove
        # this step when w2r-mod-loader is public. Pull requests from forks get no secrets and cannot build.
        env:
          W2R_LOADER_READ: ${{ secrets.W2R_LOADER_READ }}
        run: |
          if [ -z "$W2R_LOADER_READ" ]; then echo "::error::secret W2R_LOADER_READ is not set"; exit 1; fi
          git config --global url."https://x-access-token:${W2R_LOADER_READ}@github.com/hastinbe/w2r-mod-loader".insteadOf "https://github.com/hastinbe/w2r-mod-loader"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Check, build, package
        run: |
          cargo run --locked -q -p w2r-publish -- check
          cargo build --locked --release --target i686-pc-windows-msvc --workspace --exclude w2r-publish
          cargo run --locked -q -p w2r-publish -- package \
            --target-dir target/i686-pc-windows-msvc/release --out out/packages

      - name: Read the published index
        id: prev
        run: |
          mkdir -p out/prev
          if git fetch --depth 1 origin gh-pages 2>/dev/null \
             && git show FETCH_HEAD:index.json > out/prev/index.json 2>/dev/null; then
            cargo run --locked -q -p w2r-publish -- verify --index out/prev/index.json
            echo "have=true" >> "$GITHUB_OUTPUT"
          else
            echo "No published index yet; starting at serial 1."
            echo "have=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package releases for new versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One immutable release per (id, version). An existing tag is never touched.
          for z in out/packages/*.zip; do
            name=$(basename "$z" .zip)
            tag="pkg-$name"
            if gh release view "$tag" >/dev/null 2>&1; then
              # Zips are not byte-reproducible, so index the published asset, not this build's copy.
              echo "$tag exists, leaving it alone and indexing the published zip"
              gh release download "$tag" --pattern "$name.zip" --dir out/packages --clobber
            else
              gh release create "$tag" "$z" --latest=false --title "$name" --notes "Package for $name."
            fi
          done

      - name: Assemble the index
        run: |
          prev=()
          if [ "${{ steps.prev.outputs.have }}" = "true" ]; then prev=(--previous out/prev/index.json); fi
          # Package URLs are permanent release assets, one release per (id, version).
          cargo run --locked -q -p w2r-publish -- index \
            --packages out/packages \
            --url-template "$DOWNLOAD_BASE/pkg-{name}/{name}.zip" \
            --out out/index.json "${prev[@]}"
          cargo run --locked -q -p w2r-publish -- verify --index out/index.json

      - uses: actions/upload-artifact@v6
        with:
          name: index
          path: out/index.json
          if-no-files-found: error

  publish:
    needs: assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: index
          path: out
      - name: Push index.json to gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          if git ls-remote --exit-code --heads "$repo" gh-pages >/dev/null 2>&1; then
            git clone --depth 1 --branch gh-pages "$repo" pages
          else
            mkdir pages
            git -C pages init -q -b gh-pages
            git -C pages remote add origin "$repo"
          fi
          cp out/index.json pages/index.json
          touch pages/.nojekyll
          cd pages
          git add index.json .nojekyll
          if git diff --cached --quiet; then
            echo "index.json is unchanged"
            exit 0
          fi
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" \
            commit -q -m "Publish index"
          git push origin gh-pages

name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Fetch git dependencies (w2rpm) with the git CLI, so cargo uses git's credential setup instead of
# its own libgit2 client.
env:
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Let git read the private w2rpm repository
        # A fine-grained token with read access to hastinbe/w2r-mod-loader only (docs/PIPELINE.md). Remove
        # this step when w2rpm is public. Pull requests from forks get no secrets and cannot build.
        shell: bash
        env:
          W2R_LOADER_READ: ${{ secrets.W2R_LOADER_READ }}
        run: |
          if [ -z "$W2R_LOADER_READ" ]; then echo "::error::secret W2R_LOADER_READ is not set"; exit 1; fi
          git config --global url."https://x-access-token:${W2R_LOADER_READ}@github.com/hastinbe/w2r-mod-loader".insteadOf "https://github.com/hastinbe/w2r-mod-loader"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Manifests
        run: cargo run --locked -q -p w2r-publish -- check
      - name: Tool tests
        run: cargo test --locked -p w2r-publish
      - name: Build every plugin (32-bit, like the game)
        run: cargo build --locked --release --target i686-pc-windows-msvc --workspace --exclude w2r-publish
      - name: Plugin tests
        run: cargo test --locked -p w2r-chat
      - name: Package (dry run)
        run: cargo run --locked -q -p w2r-publish -- package --target-dir target/i686-pc-windows-msvc/release --out out/packages

[workspace]
resolver = "3"
members = ["plugins/*", "tools/w2r-publish"]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# Pinned to a commit of the host/manager repo so a plugin build never changes under us. Bump the
# rev in its own PR when the ABI changes. For local work against a sibling checkout see
# CONTRIBUTING.md (an untracked .cargo/config.toml patch).
w2r-abi = { git = "https://github.com/hastinbe/w2rpm", rev = "7ae9a80f20b8e74b91204f2576c7a2ecb39cf7fc" }
w2r-formats = { git = "https://github.com/hastinbe/w2rpm", rev = "7ae9a80f20b8e74b91204f2576c7a2ecb39cf7fc" }
w2rpm-lib = { git = "https://github.com/hastinbe/w2rpm", rev = "7ae9a80f20b8e74b91204f2576c7a2ecb39cf7fc" }
w2r-preview = { git = "https://github.com/hastinbe/w2rpm", rev = "793b7748c9e881d43c158625f5d4a144098e1709" }

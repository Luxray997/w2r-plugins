[workspace]
resolver = "3"
members = ["plugins/*", "tools/w2r-publish"]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# Pinned to a commit of the host/manager repo so a plugin build never changes under us. Bump the
# rev in its own PR when the ABI changes. For local work against a sibling checkout see
# CONTRIBUTING.md (an untracked .cargo/config.toml patch).
w2r-abi = { git = "https://github.com/hastinbe/w2rpm", rev = "792a821bdee5a25938620694581224097f5766be" }
w2r-formats = { git = "https://github.com/hastinbe/w2rpm", rev = "792a821bdee5a25938620694581224097f5766be" }
w2rpm-lib = { git = "https://github.com/hastinbe/w2rpm", rev = "792a821bdee5a25938620694581224097f5766be" }
